name: Build Brightline Fold APK
on:
  push:
    branches:
      - chatgpt-brightline-build-20261003
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project
        run: tar -xzf brightline_project.tar.gz
      - name: Prepare Android SDK and Gradle
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk BrightlineFold.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrightlineFold-apk
          path: BrightlineFold.apk
          retention-days: 1
